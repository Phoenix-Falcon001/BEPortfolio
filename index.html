<style>
:root{
  --bg:#FFFFFF; --surface:#F3F7FC; --ink:#0B2545; --ink-2:#4A5D78;
  --line:#D5E0EE; --accent:#1E88E5; --accent-ink:#FFFFFF; --accent-soft:#E3F0FC;
  --brainscope:#6A2CFF;
  --cyan:#18D6DC; --code-bg:#E3F9FA; --code-ink:#0B2545;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#071528; --surface:#0D2140; --ink:#EAF2FB; --ink-2:#9DB2CC;
    --line:#1D3557; --accent:#4AA3F0; --accent-ink:#071528; --accent-soft:#12305A;
    --brainscope:#9B74FF;
    --cyan:#3EE6EC; --code-bg:#0E3442; --code-ink:#3EE6EC;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
[dir="rtl"] body{line-height:1.75}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{max-width:600px;margin:0 auto;padding:20px 20px 48px}

/* language switch */
.top{display:flex;justify-content:space-between;align-items:center}
.mark{display:block;height:40px;width:40px}
.mark img{height:40px;width:40px;display:block}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{font:inherit;font-size:.85rem;font-weight:500;border:0;background:none;color:var(--ink-2);padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cyan);color:#0B2545}

/* hero */
.hero{display:flex;gap:18px;align-items:center;margin:28px 0 22px}
.photo{position:relative;width:92px;height:92px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:1.9rem;overflow:hidden;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:1.95rem;line-height:1.15;font-weight:600;margin:0;letter-spacing:-.01em}
[dir="rtl"] h1{letter-spacing:0}
.headline{margin:6px 0 0;color:var(--ink-2);font-size:1.02rem}
.place{margin:4px 0 0;font-size:.9rem;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.intro{margin:0 0 22px;max-width:60ch}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 14px;border-radius:12px;font-weight:500;font-size:.97rem;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translateY(1px)}

/* runway centerline */
.centerline{height:4px;margin:34px 0 28px;background:repeating-linear-gradient(90deg,var(--line) 0 28px,transparent 28px 44px);border-radius:2px}
[dir="rtl"] .centerline{background:repeating-linear-gradient(270deg,var(--line) 0 28px,transparent 28px 44px)}

h2{font-size:1.15rem;font-weight:600;margin:0 0 14px}

/* flight strips */
.strips{display:flex;flex-direction:column;gap:10px}
.strip{border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;border-inline-start:6px solid var(--accent)}
.strip.bsc{border-inline-start-color:var(--brainscope)}
.strip-head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:64px 1fr 28px;align-items:center;cursor:pointer;min-height:70px}
.strip-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.code{align-self:stretch;display:grid;place-items:center;font-weight:600;font-size:.95rem;letter-spacing:.06em;color:var(--code-ink);background:var(--code-bg);border-inline-end:1px solid var(--line);font-variant-numeric:tabular-nums;direction:ltr}
.strip.bsc .code{color:var(--brainscope);background:var(--surface)}
.strip-title{padding:12px 14px}
.strip-title strong{display:block;font-weight:600;font-size:1.02rem;line-height:1.3}
.strip-title span{display:block;font-size:.88rem;color:var(--ink-2);margin-top:2px}
.chev{width:18px;height:18px;transition:transform .2s ease;color:var(--ink-2)}
.strip-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.panel.open{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.panel-body{padding:4px 16px 18px;border-top:1px dashed var(--line);margin:0 0 0}
.item{padding:14px 0 0}
.item h3{font-size:.98rem;font-weight:600;margin:0}
.item .meta{font-size:.85rem;color:var(--ink-2);margin:1px 0 0}
.item p{margin:6px 0 0;font-size:.95rem;max-width:62ch}
.note{margin:16px 0 0;padding:12px 14px;background:var(--accent-soft);border-radius:8px;font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;padding:0;list-style:none}
.tags li{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);direction:ltr}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.links a{font-size:.9rem;font-weight:500;color:var(--brainscope);text-decoration:none;border:1px solid var(--brainscope);padding:6px 12px;border-radius:8px}

/* certifications */
section.block{margin-top:36px}
.certs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.certs li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem;direction:ltr;text-align:start}
[dir="rtl"] .certs li{text-align:left}
.certs .by{color:var(--ink-2);display:block;font-size:.84rem}
.certs .yr{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.88rem}
.more{all:unset;cursor:pointer;margin-top:12px;font-size:.9rem;font-weight:500;color:var(--accent)}
.langs{margin:0;font-size:.97rem}

footer{margin-top:44px;font-size:.84rem;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:380px){
  .hero{flex-direction:column;align-items:flex-start}
  h1{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){
  .panel,.chev{transition:none}
}
@media print{.lang,.actions{display:none}}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
let lang = "en", certsOpen = false, openCodes = new Set();

function renderStrips(t){
  const box = document.getElementById("strips");
  box.innerHTML = t.roles.map(r => {
    const id = "p-" + r.code;
    const items = r.items.map(i => `<div class="item">${i.h?`<h3>${esc(i.h)}</h3>`:""}${i.m?`<p class="meta">${esc(i.m)}</p>`:""}${i.p?`<p>${esc(i.p)}</p>`:""}</div>`).join("");
    const note = r.note ? `<p class="note">${esc(r.note)}</p>` : "";
    const tags = r.tags ? `<ul class="tags">${r.tags.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
    const links = (r.links && BRAINSCOPE_LINKS.length) ? `<div class="links">${BRAINSCOPE_LINKS.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>` : "";
    const open = openCodes.has(r.code);
    return `<div class="strip ${r.cls||""}">
      <button class="strip-head" type="button" aria-expanded="${open}" aria-controls="${id}" data-code="${r.code}">
        <span class="code">${r.code}</span>
        <span class="strip-title"><strong>${esc(r.title)}</strong><span>${esc(r.sub)}</span></span>
        ${chev}
      </button>
      <div class="panel ${open?"open":""}" id="${id}" role="region"><div><div class="panel-body">${items}${note}${tags}${links}</div></div></div>
    </div>`;
  }).join("");
  box.querySelectorAll(".strip-head").forEach(b => b.addEventListener("click", () => {
    const c = b.dataset.code, panel = document.getElementById("p-" + c);
    const now = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", now); panel.classList.toggle("open", now);
    now ? openCodes.add(c) : openCodes.delete(c);
  }));
}

function renderCerts(t){
  const list = certsOpen ? CERTS : CERTS.slice(0, CERTS_SHOWN);
  document.getElementById("certs").innerHTML = list.map(([n,by,y]) =>
    `<li><span>${esc(n)}<span class="by">${esc(by)}</span></span><span class="yr">${y}</span></li>`).join("");
  const more = document.getElementById("more");
  more.textContent = certsOpen ? t.showLess : t.showAll(CERTS.length);
}

function setLang(l){
  if(!TEXT[l]) l = "en";
  lang = l;
  const t = TEXT[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  document.getElementById("wa").href = "https://wa.me/" + CONTACT.phone.replace(/\D/g,"") + "?text=" + encodeURIComponent(CONTACT.whatsappText[l]);
  document.getElementById("mail").href = "mailto:" + CONTACT.email;
  renderStrips(t); renderCerts(t);
  if(location.hash.slice(1) !== l) history.replaceState(null, "", "#" + l);
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.getElementById("more").addEventListener("click", () => { certsOpen = !certsOpen; renderCerts(TEXT[lang]); });
document.getElementById("yr").textContent = new Date().getFullYear();

/* Language: #en / #ar / #fr in the link wins, otherwise the phone's language */
const fromHash = location.hash.slice(1);
const fromPhone = (navigator.language || "en").slice(0,2);
setLang(TEXT[fromHash] ? fromHash : (TEXT[fromPhone] ? fromPhone : "en"));
